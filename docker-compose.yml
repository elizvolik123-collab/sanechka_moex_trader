# Запуск на сервере: docker compose up -d --build
# Переменные берутся из .env (см. .env.example); DATABASE_URL переопределяется на контейнер postgres.
# Снаружи открыты только 80/443 (Caddy, автоматический HTTPS); приложение и база — во внутренней сети.

x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@postgres:5432/moex_trader

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: moex_trader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      # builtin C.UTF-8: регистронезависимый поиск по кириллице
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moex_trader"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., target: tools }
    <<: *app-env
    command: ["pnpm", "db:deploy"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., target: web }
    <<: *app-env
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - appdata:/app/.data
    healthcheck:
      # В образе нет curl — проверяем средствами Node
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., target: tools }
    <<: *app-env
    restart: unless-stopped
    # Общий том с web: воркер скачивает картинки новостей, web их отдаёт
    volumes:
      - appdata:/app/.data
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env (например, trader.example.ru)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
